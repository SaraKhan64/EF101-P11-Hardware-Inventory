function hist(id){const x=S.a.find(y=>y.id==id),r=S.m.filter(y=>y.aid==id).sort((a,b)=>b.date.localeCompare(a.date));
$("d").innerHTML=`<h3>${x.tag}: maintenance history</h3><p class="mu">${esc(x.mfr+" "+x.model)} · ${r.length} event(s) · total cost ${r.reduce((s,y)=>s+y.cost,0).toLocaleString()}</p>${mt(r)}<p><button class="p" onclick="editM(${id})">+ Log event</button> <button onclick="$('d').close()">Close</button></p>`;$("d").showModal()}
function form(title,fields,o,ok){const v=o||{};$("d").innerHTML=`<h3>${title}</h3><div class="fg">${fields.map(([k,l,t,opt])=>`<label>${l}${t=="select"?`<select id="f_${k}">${opt.map(z=>`<option value="${z[0]??z}" ${(v[k]??"")==(z[0]??z)?"selected":""}>${z[1]??z}</option>`).join("")}</select>`:`<input id="f_${k}" type="${t}" value="${esc(v[k])}" ${opt?`list="l_${k}"`:""}>${opt?`<datalist id="l_${k}">${opt.map(z=>`<option>${esc(z)}</option>`).join("")}</datalist>`:""}`}</label>`).join("")}</div><div class="er" id="er"></div><button class="p" id="sv">Save</button> <button onclick="$('d').close()">Cancel</button>`;
$("sv").onclick=()=>{const n={};fields.forEach(([k,,t])=>{const e=$("f_"+k).value.trim();n[k]=t=="number"?+e:e});const er=ok(n);if(er)$("er").textContent=er;else{save();$("d").close();go()}};$("d").showModal()}
function editA(id){const o=id?S.a.find(x=>x.id==id):null;form(o?"Edit asset":"Add asset",[["tag","Asset tag","text"],["mfr","Manufacturer","text",uniq("mfr")],["model","Model","text"],["cpu","CPU family","text",uniq("cpu")],["ram","RAM (GB)","number"],["storage","Storage (GB)","number"],["stype","Storage type","select",["SSD","HDD"]],["gpu","GPU","text",uniq("gpu")],["os","Operating system","text",uniq("os")],["ip","IP address","text"],["loc","Location","text",uniq("loc")],["purchase","Purchase date","date"],["warranty","Warranty","select",["In Warranty","Expired"]],["status","Status","select",["Operational","Faulty","Under Maintenance"]]],o,n=>{
for(const k of["tag","mfr","model","cpu","loc","purchase"])if(!n[k])return"Please fill in: "+k;if(!(n.ram>0&&n.storage>0))return"RAM and storage must be positive numbers";if(n.ip&&!/^(\d{1,3}\.){3}\d{1,3}$/.test(n.ip))return"IP address format is invalid";if(S.a.some(x=>x.tag==n.tag&&x.id!=id))return"Asset tag already exists";
if(o)Object.assign(o,n);else S.a.push({...n,id:Math.max(0,...S.a.map(x=>x.id))+1,active:true})})}
function editM(aid){form("Log fault / maintenance",[["aid","Asset","select",S.a.map(x=>[x.id,x.tag])],["date","Date","date"],["cat","Fault category","text",[...new Set(S.m.map(x=>x.cat))]],["desc","Fault description","text"],["action","Action taken","text"],["tech","Technician","text"],["cost","Cost","number"]],{aid:aid||"",date:new Date().toISOString().slice(0,10),cost:0},n=>{
if(!n.date||!n.cat||!n.desc||!n.tech)return"Date, category, description and technician are required";if(n.cost<0||isNaN(n.cost))return"Cost must be 0 or more";S.m.push({...n,aid:+n.aid,id:Math.max(0,...S.m.map(x=>x.id))+1,cat:n.cat.toUpperCase()})})}
function retire(id){const x=S.a.find(y=>y.id==id);if(confirm((x.active?"Retire ":"Restore ")+x.tag+"?")){x.active=!x.active;save();assets()}}
function delM(id){if(confirm("Delete this record?")){S.m=S.m.filter(x=>x.id!=id);save();$("d").open&&$("d").close();go()}}
const csv=(rows)=>{const k=Object.keys(rows[0]||{});return[k.join(","),...rows.map(r=>k.map(c=>'"'+String(r[c]).replace(/"/g,'""')+'"').join(","))].join("\n")};
async function dl(name,data){let d=null;try{d=await claude.use("downloads")}catch(e){}if(!d){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();return}try{await d.save({filename:name,data});$("em").textContent=""}catch(e){$("em").textContent=e.code=="declined"?"":"Could not save: "+(e.message||e.code)}}
function exp(){$("m").innerHTML=`<div class="c"><h3>Export</h3><p class="mu">Saves a file you can open in Excel or import into Access.</p><button onclick="dl('assets.csv',csv(S.a))">Assets (CSV)</button> <button onclick="dl('maintenance.csv',csv(S.m.map(x=>({...x,asset:tagOf(x.aid)}))))">Maintenance (CSV)</button> <button onclick="dl('inventory.json',JSON.stringify(S,null,2))">Everything (JSON)</button> <button onclick="if(confirm('Reset to the original sample data?')){S=JSON.parse(JSON.stringify(SEED));save();go()}">Reset sample data</button><p class="er" id="em"></p></div>`}
function guide(){const G=[["Asset ID / Asset tag","A unique key per device so every repair, warranty claim and audit points at exactly one machine."],["Manufacturer / model","Drives spare-part compatibility, driver support and which vendor to call for warranty."],["CPU family (Core i3/i5/i7, Ryzen)","Shows performance class and age, which decides whether a PC suits teaching, office work or needs replacing."],["RAM vs storage","RAM is short-term working memory (lost at power-off) that affects multitasking; storage is long-term capacity for files. Different upgrades fix different complaints."],["SSD vs HDD","SSDs are flash with no moving parts: faster and more shock-tolerant. HDDs are cheaper per GB but spin and fail more, so they get tracked for replacement."],["GPU","Integrated graphics are fine for office work; a dedicated GPU (GTX/RTX) is needed for graphics and AI labs, so allocation matters."],["Operating system","Windows 10 reached end of support, and Ubuntu machines need different admin skills. Tracking OS supports patching and licensing."],["Asset ID vs IP address","The asset ID is permanent and identifies the device; the IP address is a network identity that can change and shows where it sits on the network."],["Location","Tells a technician where to go and shows where capacity is concentrated."],["Purchase date & warranty","Warranty decides whether a repair is free or paid, and purchase date gives age for replacement planning."],["Operational status","Operational, Faulty or Under Maintenance gives the quick picture of usable capacity."],["Maintenance history","Fault date, description, action, technician and cost show repeat failures, which components fail most, repair spend and technician workload. Repeated failures justify replacing a machine instead of repairing it again."],["Retire/deactivate","Retired assets keep their history for audits but drop out of the dashboard counts."]];
$("m").innerHTML=`<div class="c"><h3>Why each field is tracked</h3><dl>${G.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl></div>`}
go();
</script></body></html>
